[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "face_glitch_mob"
version = "0.1.0"
description = "insert description something something lol"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "opencv-python",
    "numpy",
    "python-dotenv"
]

# --- Tool configs ---

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
line_length = 88
include_trailing_comma = true
multi_line_output = 3

[tool.setuptools.packages.find]
include = ["face_glitch_mob*"]
exclude = ["input*", "output*", "old_files*"]